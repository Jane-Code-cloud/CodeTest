spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            logger-level: full
            connect-timeout: 3000 #毫秒
            read-timeout: 5000
          service-product:
            logger-level: full
            connect-timeout: 3000
            read-timeout: 5000
#            request-interceptors:
#              - com.example.feign.interceptor.FeignRequestInterceptor
    sentinel:
      transport:
        dashboard: localhost:8080
      eager: true #项目一启动自动连上控制台
      web-context-unify: false


feign:
  sentinel:
    enabled: true